de:
  title: BABY RUN
  type: Kurzfilm
  genre: Dramedy
  synopsis: >-
    Schreiende Eltern, verwirrte Babies und eine Turnhalle. Als bei einem Baby
    Wettkrabbeln eines der Babys plötzlich versehentlich die Regeln bricht,
    können die vom Erfolgsdruck aufgeheizten Eltern nicht mehr an sich halten.
  billingHeader: |-
    EINE WILLIT GRAIN PRODUKTION MIT

    ELLI • KAILEY • LEVI 
  billingFooter: >-
    VIELEN DANK


