en:
  title: BABY RUN
  type: Shortfilm
  genre: Dramedy
  synopsis: >-
    Screaming parents, confused babies, and a gymnasium. During a competitive
    baby crawling race, one baby suddenly breaks the rules by accident -
    triggering the highly competitive parents, who can no longer contain
    themselves.
  billingHeader: |-
    A UNIVERSITY OF TELEVISION AND FILM MUNICH PRODUCTION WITH

    ELLI • KAILEY • LEVI
  billingFooter: >-
    THANK YOU


    TO ALL PARENTS • TO ALL EXTRAS • SPARKS RENTAL • LANDESHAUPTSTADT MÜNCHEN -
    REFERAT FÜR BILDUNG UND SPORT • HOCHSCHULE ANSBACH


