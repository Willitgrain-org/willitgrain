  synopsis: >-
    Sie spricht für diejenigen, denen die Welt den Mund verschlossen hat, und
    erinnert daran, dass Stimmen, die sich für Menschenrechte einsetzen, nicht
    zum Verstummen gebracht werden dürfen.
